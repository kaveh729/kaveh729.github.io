<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>片头动画演示</title>
<style>
  :root {
    --bg: #f0f7f2;
    --text: #081c10;
    --muted: #2f4a38;
    --accent: #0f8a5f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }

  /* ===== 片头动画 ===== */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }

  .intro.hide {
    opacity: 0;
    visibility: hidden;
  }

  .intro-inner {
    text-align: center;
    animation: introIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* 头像：圆形 + 光圈 + 上下浮动 */
  .intro-avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    display: inline-block;
    animation: avatarFloat 2.4s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(15, 138, 95, 0.5);
  }

  .intro-title {
    margin-top: 20px;
    font-size: 22px;
    letter-spacing: 6px;
    color: var(--accent);
    font-weight: 600;
  }

  .intro-sub {
    margin-top: 6px;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
  }

  @keyframes introIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes avatarFloat {
    0% {
      transform: translateY(0);
      box-shadow: 0 0 0 0 rgba(15, 138, 95, 0.45);
    }
    50% {
      transform: translateY(-10px);
      box-shadow: 0 0 0 14px rgba(15, 138, 95, 0);
    }
    100% {
      transform: translateY(0);
      box-shadow: 0 0 0 0 rgba(15, 138, 95, 0);
    }
  }

  /* ===== 演示页面正文 ===== */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 20px;
  }

  h1 { font-size: 28px; }
  p { color: var(--muted); }

  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <!-- 片头动画层 -->
  <div id="intro" class="intro">
    <div class="intro-inner">
      <img class="intro-avatar"
           src="362548f4c208cbb17188044ebbba60e7_3360623059818334571.png"
           alt="头像">
      <div class="intro-title">尤黎猫</div>
      <div class="intro-sub">小宇宙</div>
    </div>
  </div>

  <!-- 演示页面内容 -->
  <div class="container">
    <h1>这是你的主页</h1>
    <p>片头动画播完后，就会进入这里。</p>
    <p>刚才头像轻轻浮动、光圈扩散，就是片头效果。</p>
    <button class="btn" onclick="playIntro()">再播放一次</button>
  </div>

  <script>
    var intro = document.getElementById('intro');

    function playIntro() {
      intro.classList.remove('hide');
      intro.style.display = 'flex';
      void intro.offsetWidth;
      setTimeout(function () {
        intro.classList.add('hide');
      }, 1800);
    }

    setTimeout(playIntro, 100);
  </script>

</body>
</html>
