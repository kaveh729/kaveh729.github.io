<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>日志 | 尤黎猫</title>
  <link rel="icon" href="favicon.png">
  <style>
    :root {
      --bg: #f0f7f2;
      --card: #ffffff;
      --text: #081c10;
      --muted: #2f4a38;
      --accent: #0f8a5f;
      --gold: #c9a227;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background-image:
        linear-gradient(rgba(240, 247, 242, 0.75), rgba(240, 247, 242, 0.75)),
        url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.8;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .back:hover { text-decoration: underline; }

    h1 {
      font-size: 32px;
      margin: 0 0 8px;
    }

    .lead {
      color: var(--muted);
      margin: 0 0 20px;
    }

    .write-toggle {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 24px;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .write-toggle:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .write-form {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(15, 138, 95, 0.25);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .write-form input,
    .write-form textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(15, 138, 95, 0.25);
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.85);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .write-form input:focus,
    .write-form textarea:focus {
      border-color: var(--accent);
    }

    .write-form textarea {
      min-height: 160px;
      resize: vertical;
    }

    .write-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .write-actions button {
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid rgba(15, 138, 95, 0.3);
      background: rgba(255, 255, 255, 0.8);
      color: var(--accent);
      transition: all 0.15s ease;
    }

    .write-actions button:hover {
      background: rgba(15, 138, 95, 0.1);
    }

    .write-actions button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .write-actions button.primary:hover {
      opacity: 0.9;
    }

    .write-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(15, 138, 95, 0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: fadeUp 0.5s ease both;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
    }

    .entry-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .entry-date {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .entry-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 10px;
      color: var(--text);
    }

    .entry-body {
      color: var(--text);
      font-size: 15px;
    }

    .entry-body p { margin: 0 0 10px; }

    .entry-img {
      width: 100%;
      border-radius: 10px;
      margin: 12px 0;
      border: 1px solid rgba(15, 138, 95, 0.15);
      display: block;
    }

    .entry-tags {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(15, 138, 95, 0.12);
      color: var(--accent);
    }

    .entry-delete {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid rgba(200, 60, 60, 0.3);
      color: #c0392b;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .entry-delete:hover {
      background: rgba(200, 60, 60, 0.1);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-top: 40px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← 返回首页</a>

    <h1>我的日志</h1>
    <p class="lead">记录学习、生活和想法。</p>

    <button id="toggleWrite" class="write-toggle">✍️ 写新日志</button>

    <div id="writeForm" class="write-form" style="display:none;">
      <input type="date" id="entryDate">
      <input type="text" id="entryTitle" placeholder="标题">
      <textarea id="entryBody" placeholder="正文..."></textarea>
      <input type="text" id="entryTags" placeholder="标签，用逗号分隔（可选）">
      <p class="write-hint">
      </p>
      <div class="write-actions">
        <button id="saveEntry" class="primary">保存</button>
        <button id="cancelWrite">取消</button>
        <button id="exportEntries">导出备份</button>
      </div>
    </div>

    <div id="journalList"></div>

    <footer>
      © 2026 尤黎猫 · 世界在我脚下
    </footer>
  </div>

  <script>
    var entries = [
      {
        date: "2026-09-27",
        title: "纪念！",
        body: `
          <p>忙活了半天，终于拥有了一个属于我的个人网页！好好玩！</p>
          <p>以后将在这上面记录生活，嘿嘿。</p
          <p>感觉非常适合在这上面记录我的美味家产呀😋</p>
        `,
        tags: ["随笔", "📝"]
      }
    ];

    var STORAGE_KEY = 'my_journal_entries';

    function getLocalEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveLocalEntries(arr) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    }

    // 把纯文本转成段落
    function textToHtml(text) {
      return text
        .split(/\n+/)
        .filter(function (line) { return line.trim(); })
        .map(function (line) {
          return '<p>' + line
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;') + '</p>';
        })
        .join('');
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderCard(item, index, isLocal) {
      var card = document.createElement('article');
      card.className = 'card';
      card.style.animationDelay = (index * 0.06) + 's';

      var tagsHtml = '';
      if (item.tags && item.tags.length) {
        tagsHtml = '<div class="entry-tags">' +
          item.tags.map(function (t) {
            return '<span class="tag">' + escapeHtml(t) + '</span>';
          }).join('') +
          '</div>';
      }

      var deleteBtn = isLocal
        ? '<button class="entry-delete" data-index="' + index + '">删除</button>'
        : '';

      var bodyHtml = isLocal ? textToHtml(item.body) : item.body;

      card.innerHTML =
        '<div class="entry-head">' +
          '<div>' +
            '<div class="entry-date">' + escapeHtml(item.date) + '</div>' +
            '<h2 class="entry-title">' + escapeHtml(item.title) + '</h2>' +
          '</div>' +
          deleteBtn +
        '</div>' +
        '<div class="entry-body">' + bodyHtml + '</div>' +
        tagsHtml;

      return card;
    }

    function renderAll() {
      var list = document.getElementById('journalList');
      list.innerHTML = '';

      var localEntries = getLocalEntries();

      localEntries.forEach(function (item, i) {
        list.appendChild(renderCard(item, i, true));
      });

      entries.forEach(function (item, i) {
        list.appendChild(renderCard(item, i, false));
      });

      list.querySelectorAll('.entry-delete').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = parseInt(btn.dataset.index, 10);
          if (!confirm('确定删除这条日志？删除后无法恢复。')) return;
          var arr = getLocalEntries();
          arr.splice(idx, 1);
          saveLocalEntries(arr);
          renderAll();
        });
      });
    }

    var toggleBtn = document.getElementById('toggleWrite');
    var formEl = document.getElementById('writeForm');
    var dateInput = document.getElementById('entryDate');
    var titleInput = document.getElementById('entryTitle');
    var bodyInput = document.getElementById('entryBody');
    var tagsInput = document.getElementById('entryTags');

    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = String(today.getMonth() + 1).padStart(2, '0');
    var dd = String(today.getDate()).padStart(2, '0');
    dateInput.value = yyyy + '-' + mm + '-' + dd;

    toggleBtn.addEventListener('click', function () {
      var hidden = formEl.style.display === 'none';
      formEl.style.display = hidden ? 'flex' : 'none';
      toggleBtn.textContent = hidden ? '收起' : '✍️ 写新日志';
    });

    document.getElementById('cancelWrite').addEventListener('click', function () {
      formEl.style.display = 'none';
      toggleBtn.textContent = '✍️ 写新日志';
      titleInput.value = '';
      bodyInput.value = '';
      tagsInput.value = '';
    });

    document.getElementById('saveEntry').addEventListener('click', function () {
      var date = dateInput.value || (yyyy + '-' + mm + '-' + dd);
      var title = titleInput.value.trim();
      var body = bodyInput.value.trim();
      var tagsRaw = tagsInput.value.trim();

      if (!title || !body) {
        alert('标题和正文都要填哦。');
        return;
      }

      var tags = tagsRaw
        ? tagsRaw.split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean)
        : [];

      var arr = getLocalEntries();
      arr.unshift({ date: date, title: title, body: body, tags: tags });
      saveLocalEntries(arr);

      titleInput.value = '';
      bodyInput.value = '';
      tagsInput.value = '';
      formEl.style.display = 'none';
      toggleBtn.textContent = '✍️ 写新日志';

      renderAll();
    });

    document.getElementById('exportEntries').addEventListener('click', function () {
      var arr = getLocalEntries();
      if (!arr.length) {
        alert('还没有本地日志可以导出。');
        return;
      }
      var text = JSON.stringify(arr, null, 2);
      navigator.clipboard.writeText(text).then(function () {
        alert('已复制到剪贴板，粘贴到记事本保存吧。');
      }).catch(function () {
        // 复制失败时用弹窗显示
        prompt('复制下面的内容保存：', text);
      });
    });

    renderAll();
  </script>
</body>
</html>
