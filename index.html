<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尤黎猫 | 小宇宙</title>
  <style>
    :root {
      --bg: #0b1f16;
      --card: #123326;
      --text: #e6f5ec;
      --muted: #9dc4ae;
      --accent: #34d399;
      --gold: #e0b84a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .avatar {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
    }

    nav {
      margin: 24px 0 32px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      color: var(--gold);
      text-decoration: underline;
    }

    .card {
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .project {
      border-left: 3px solid var(--accent);
      padding-left: 14px;
      margin: 18px 0;
    }

    .project h3 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .project p {
      margin: 0;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-top: 40px;
    }

    a {
      color: var(--accent);
    }

    @media (max-width: 520px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img class="avatar" src="362548f4c208cbb17188044ebbba60e7_3360623059818334571.png" alt="头像">
      <div>
        <h1>尤黎猫</h1>
        <p class="subtitle">喵喵咪咪喵喵咪，咪咪喵喵咪咪喵，喵。</p>
      </div>
    </header>

    <nav>
      <a href="#about">About Me</a>
      <a href="#projects">Wish</a>
      <a href="#contact">Contact</a>
    </nav>

    <section id="about" class="card">
      <h2>泥嚎</h2>
      <p>持续探索人类世界中</p>
    </section>

    <section id="projects" class="card">
      <h2>愿望 / 清单</h2>

      <div class="project">
        <h3>请务必监督我😠</h3>
        <p>十二点之前睡觉！</p>
      </div>

      <div class="project">
        <h3>如果可以的话🤔</h3>
        <p>每周锻炼三次吧！</p>
      </div>
    </section>

    <section id="contact" class="card">
      <h2>人，请联系我</h2>
      <p>邮箱：<a href="mailto:你的邮箱@example.com">1806656233@qq.com</a></p>
      <p>GitHub：<a href="https://github.com/你的用户名">@kaveh729</a></p>
    </section>

    <footer>
      © 2026 尤黎猫 · 世界在我脚下
    </footer>
  </div>
</body>
</html>
